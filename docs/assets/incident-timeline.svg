<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="ttl dsc">
<!-- Palette reason: incident timeline. Slate ink for structure, teal for the metric series and
     healthy signal, one amber accent carrying the incident itself: the deploy that started it,
     the latency samples at or above the recorded 470ms breach onset, and the ERROR log events.
     Colour is the encoding here, not decoration, so the legend prints what each mark means.
     Flat fills, no gradients, no filters. -->
<title id="ttl">Aligned incident timeline, 8.4 minutes across three sources</title>
<desc id="dsc">Three lanes share a minute axis measured from the first event. The deploy lane marks the
v2.4.1 deploy and the v2.4.0 rollback. The metric lane plots fourteen latency samples from 205ms to
705ms, with samples at or above the 470ms breach onset drawn in amber. The logs lane shows twelve
events, sized and coloured by severity, including a burst of five ERROR entries. Dashed connectors
show the three correlations the tool recorded: deploy to breach, deploy to error burst, and rollback
to recovery.</desc>

<rect x="0" y="0" width="760" height="352" fill="#ffffff"/>

<text x="96" y="36" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2933">Aligned incident timeline</text>
<text x="96" y="56" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">minutes from first event, reference clock</text>

<!-- lanes -->
<rect x="96" y="72" width="640" height="64" rx="3" fill="#eef2f5"/>
<text x="84" y="108" text-anchor="end" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="12" fill="#1f2933">deploy</text>
<rect x="96" y="144" width="640" height="64" rx="3" fill="#eef2f5"/>
<text x="84" y="180" text-anchor="end" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="12" fill="#1f2933">metric</text>
<rect x="96" y="216" width="640" height="64" rx="3" fill="#eef2f5"/>
<text x="84" y="252" text-anchor="end" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="12" fill="#1f2933">logs</text>

<!-- axis -->
<line x1="96" y1="300" x2="736" y2="300" stroke="#52606d" stroke-width="1"/>
<line x1="96" y1="72" x2="96" y2="300" stroke="#cbd2d9" stroke-width="1"/>
<text x="96" y="316" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#52606d">0</text>
<line x1="248" y1="72" x2="248" y2="300" stroke="#cbd2d9" stroke-width="1"/>
<text x="248" y="316" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#52606d">2</text>
<line x1="400" y1="72" x2="400" y2="300" stroke="#cbd2d9" stroke-width="1"/>
<text x="400" y="316" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#52606d">4</text>
<line x1="552" y1="72" x2="552" y2="300" stroke="#cbd2d9" stroke-width="1"/>
<text x="552" y="316" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#52606d">6</text>
<line x1="704.5" y1="72" x2="704.5" y2="300" stroke="#cbd2d9" stroke-width="1"/>
<text x="704.5" y="316" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#52606d">8</text>

<!-- recorded correlations -->
<line x1="96" y1="104" x2="173.5" y2="178.8" stroke="#52606d" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="96" y1="104" x2="292.5" y2="248" stroke="#52606d" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="552" y1="104" x2="522.5" y2="178.8" stroke="#52606d" stroke-width="1" stroke-dasharray="3 3"/>

<!-- deploy lane -->
<circle cx="96" cy="104" r="6" fill="#b06a00"/>
<text x="106" y="100" text-anchor="start" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933">deploy v2.4.1</text>
<circle cx="552" cy="104" r="5" fill="#ffffff" stroke="#0f7d74" stroke-width="1.5"/>
<text x="552" y="94" text-anchor="middle" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933">rollback v2.4.0</text>

