<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="ttl dsc">
<!-- Palette reason: same incident timeline scheme as the diagram. Slate ink for
     structure, teal for the three source lanes, one amber dot marking the deploy
     event that starts every incident this tool reconstructs. The mark is a
     literal three-lane timeline: the tool's core data structure. Flat fills. -->
<title id="ttl">PostmortemForge logo</title>
<desc id="dsc">A three lane timeline mark above the wordmark PostmortemForge, with the deploy morpheme split in colour. The amber dot marks a deploy event on the top lane.</desc>
<rect x="0" y="0" width="240" height="240" fill="#ffffff"/>
<!-- Mark: three source lanes, each a rule with event dots. One amber deploy dot. -->
<g>
<line x1="40" y1="72" x2="200" y2="72" stroke="#1f2933" stroke-width="1.5"/>
<line x1="40" y1="100" x2="200" y2="100" stroke="#1f2933" stroke-width="1.5"/>
<line x1="40" y1="128" x2="200" y2="128" stroke="#1f2933" stroke-width="1.5"/>
